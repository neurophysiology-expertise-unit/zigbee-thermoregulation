# Scenario: closed-loop brain cooling with the Pico/MAX31856 thermocouple probe.
# Body sensor: thermocouple reader (tc_probe, see hardware.local.json).
# Ambient sensor: ESP32 hamsterpod (esp32_east, probe t1).
#
# Pulse mode: OFF. The RFID EMI problem (RFID reader blinded by the heat lamp)
# was specific to that hardware. A DC Peltier generates no RF interference, so
# the thermocouple reader is unaffected and pulsing gives no benefit here.
# Check raw_rfid_age_s empirically if you later add an RFID reader alongside
# the Peltier to confirm, but leave pulse OFF until there is evidence otherwise.
#
# Safety note: with the ESP32 ambient sensor present the box-air floor
# (ambient_min_c) is active. If the ESP32 is missing or dies the only guards
# are body_min_c, max_continuous_on_s, and the watchdog. Someone stays at
# the rig.
hardware_file: ../hardware.local.json
actuator: sonoff_plug
ambient_sensor: esp32_east
body_sensor: tc_probe

control:
  mode: cool
  body_setpoint_c: 29.5
  body_deadband_c: 0.3
  ambient_setpoint_c: 20.0
  ambient_deadband_c: 0.5
  loop_period_s: 5.0
  min_on_s: 30.0
  min_off_s: 30.0

safety:
  ambient_min_c: 15.0
  body_min_c: 28.0
  lockout_release_hysteresis_c: 1.0
  max_continuous_on_s: 900.0
  watchdog_timeout_s: 30.0

sensors:
  # Thermocouple gives ~4 Hz; 5 s stale timeout means 20 missed readings
  # before the channel ages out.  Much tighter than the 30 s used for RFID.
  body_stale_after_s: 5.0
  # Low end (24.0) must sit below body_min_c (28.0) so a floor breach is NOT
  # discarded as implausible before the safety supervisor can see it.
  body_valid_range: [24.0, 42.0]
  ambient_stale_after_s: 300.0
  ambient_valid_range: [5.0, 60.0]
